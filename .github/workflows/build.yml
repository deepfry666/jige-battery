name: 构建 Windows 探针和托盘

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: 还原依赖
        run: dotnet restore Jige.slnx
      - name: 编译解决方案
        run: dotnet build Jige.slnx -c Release --no-restore
      - name: 运行测试
        run: dotnet test Jige.slnx -c Release --no-build -m:1 --blame-hang-timeout 60s
      - name: 发布 win-x64 NativeAOT 探针
        run: dotnet publish src/Jige.Probe/Jige.Probe.csproj -c Release -r win-x64 -p:PublishAot=true -o artifacts/win-x64
      - name: 检查原生程序启动及枚举
        shell: pwsh
        run: |
          if (-not (Test-Path .\artifacts\win-x64\LICENSE)) { throw "发布目录缺少许可证" }
          & .\artifacts\win-x64\Jige.Probe.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\artifacts\win-x64\Jige.Probe.exe list
          exit $LASTEXITCODE
      - name: 上传探针
        uses: actions/upload-artifact@v7
        with:
          name: jige-probe-win-x64
          path: |
            artifacts/win-x64/Jige.Probe.exe
            artifacts/win-x64/LICENSE
          if-no-files-found: error

      - name: 发布 win-x64 NativeAOT 托盘
        run: dotnet publish src/Jige.Tray/Jige.Tray.csproj -c Release -r win-x64 -p:PublishAot=true -o artifacts/tray-win-x64
      - name: 检查原生托盘程序启动和图标生成
        shell: pwsh
        run: |
          if (-not (Test-Path .\artifacts\tray-win-x64\LICENSE)) { throw "发布目录缺少许可证" }
          $env:JIGE_CHECK_LOG = Join-Path $env:RUNNER_TEMP 'jige-check.txt'
          $tray = Start-Process -FilePath .\artifacts\tray-win-x64\Jige.exe -ArgumentList '--check' -Wait -PassThru
          if ($tray.ExitCode -ne 0 -and (Test-Path $env:JIGE_CHECK_LOG)) { Get-Content $env:JIGE_CHECK_LOG }
          exit $tray.ExitCode
      - name: 上传托盘
        uses: actions/upload-artifact@v7
        with:
          name: jige-tray-win-x64
          path: |
            artifacts/tray-win-x64/Jige.exe
            artifacts/tray-win-x64/LICENSE
          if-no-files-found: error
