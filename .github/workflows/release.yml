name: 发布几格正式版

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-stable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.number }}
      is_latest: ${{ steps.publish.outputs.is_latest }}
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: 缓存 NuGet 依赖
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: 读取正式版版本与更新记录
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') {
            throw "正式版标签必须使用 vX.Y.Z 格式"
          }
          $version = $tag.Substring(1)
          [xml]$props = Get-Content Directory.Build.props -Raw -Encoding utf8
          $propsVersion = ($props.Project.PropertyGroup.VersionPrefix | Select-Object -First 1).Trim()
          if ($propsVersion -ne $version) {
            throw "Directory.Build.props 中的 VersionPrefix ($propsVersion) 与标签 $version 不一致"
          }
          $iss = Get-Content installer/jige.iss -Raw -Encoding utf8
          $issMatch = [regex]::Match($iss, '(?m)^\s*#define\s+AppVersion\s+"([^"]+)"')
          if (-not $issMatch.Success -or $issMatch.Groups[1].Value -ne $version) {
            throw "installer/jige.iss 中的 AppVersion ($($issMatch.Groups[1].Value)) 与标签 $version 不一致"
          }
          $notes = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $heading = [regex]::Escape("## [$version]")
          $section = [regex]::Match($notes, "(?ms)^$heading[^\S\r\n]*\r?\n(.*?)(?=^## |\z)")
          if (-not $section.Success -or [string]::IsNullOrWhiteSpace($section.Groups[1].Value)) {
            throw "CHANGELOG.md 缺少 $version 的更新记录"
          }
          $section.Groups[1].Value.Trim() | Set-Content release-notes.md -Encoding utf8
          foreach ($siteFile in @('site/index.html', 'site/download.html', 'README.md')) {
            $siteText = Get-Content $siteFile -Raw -Encoding utf8
            $matches = [regex]::Matches($siteText, '(?:data-version>v|releases/v|Jige-Setup-)((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))(?=[</\-])')
            if ($matches.Count -eq 0) {
              throw "$siteFile 中未找到静态版本号位点"
            }
            $mismatch = $matches | ForEach-Object { $_.Groups[1].Value } | Where-Object { $_ -ne $version } | Select-Object -Unique
            if ($mismatch) {
              throw "$siteFile 中存在未同步的版本号（$($mismatch -join ', ')），请统一更新为 $version"
            }
          }
          "number=$version" >> $env:GITHUB_OUTPUT
      - name: 编译解决方案
        shell: pwsh
        env:
          JIGE_VERSION: ${{ steps.version.outputs.number }}
        run: dotnet build Jige.slnx -c Release "-p:Version=$env:JIGE_VERSION" -warnaserror
      - name: 运行测试
        shell: pwsh
        run: dotnet test Jige.slnx -c Release --no-build -m:1 --blame-hang-timeout 60s
      - name: 发布 win-x64 NativeAOT 托盘
        shell: pwsh
        env:
          JIGE_VERSION: ${{ steps.version.outputs.number }}
        run: dotnet publish src/Jige.Tray/Jige.Tray.csproj -c Release -r win-x64 -p:PublishAot=true "-p:Version=$env:JIGE_VERSION" -o artifacts/tray-win-x64
      - name: 验证托盘自检与文件版本
        shell: pwsh
        env:
          JIGE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $exe = Get-Item artifacts/tray-win-x64/Jige.exe
          $expected = [version] "${env:JIGE_VERSION}.0"
          $actual = [version] $exe.VersionInfo.FileVersion
          if ($actual -ne $expected) { throw "Jige.exe 文件版本 $actual 与标签 $env:JIGE_VERSION 不一致" }
          if ($exe.VersionInfo.ProductVersion -cnotmatch ('\A' + [regex]::Escape($env:JIGE_VERSION) + '(?:\+|\z)')) {
            throw "Jige.exe 产品版本 $($exe.VersionInfo.ProductVersion) 与标签 $env:JIGE_VERSION 不一致"
          }
          $env:JIGE_CHECK_LOG = Join-Path $env:RUNNER_TEMP 'jige-check.txt'
          $tray = Start-Process -FilePath $exe.FullName -ArgumentList '--check' -Wait -PassThru
          if ($tray.ExitCode -ne 0 -and (Test-Path $env:JIGE_CHECK_LOG)) { Get-Content $env:JIGE_CHECK_LOG }
          exit $tray.ExitCode
      - name: 编译 Inno Setup 安装包
        shell: pwsh
        env:
          JIGE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          function Find-Compiler {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              foreach ($major in @(7, 6)) {
                $candidate = Join-Path $root "Inno Setup $major/ISCC.exe"
                if (Test-Path $candidate) { return $candidate }
              }
            }
          }

          $compiler = Find-Compiler
          if (-not $compiler) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install innosetup --no-progress -y
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { exit $LASTEXITCODE }
              Start-Sleep -Seconds 5
            }
            $compiler = Find-Compiler
          }
          if (-not $compiler) { throw "找不到 Inno Setup 编译器 ISCC.exe" }
          & $compiler "/DAppVersion=$env:JIGE_VERSION" 'installer/jige.iss'
          exit $LASTEXITCODE
      - name: 生成 SHA256SUMS.txt
        shell: pwsh
        env:
          JIGE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $name = "Jige-Setup-${env:JIGE_VERSION}-x64.exe"
          $hash = (Get-FileHash "artifacts/release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
      - name: 创建或更新 GitHub 正式 Release
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JIGE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = "artifacts/release/Jige-Setup-${env:JIGE_VERSION}-x64.exe"
          $checksums = 'artifacts/release/SHA256SUMS.txt'
          $targetVer = [version]$env:JIGE_VERSION
          $latestFlag = '--latest'
          $isLatest = 'true'
          $latestTag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq '.tagName' 2>$null
          if ($LASTEXITCODE -eq 0 -and $latestTag -cmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') {
            $currentLatest = [version]$latestTag.Substring(1)
            if ($targetVer -lt $currentLatest) {
              $latestFlag = '--latest=false'
              $isLatest = 'false'
            }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $checksums --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY $latestFlag --title "几格 v$env:JIGE_VERSION" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($latestFlag -eq '--latest=false') {
              $afterLatest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq '.tagName' 2>$null
              if ($LASTEXITCODE -eq 0 -and $afterLatest -eq $tag) {
                throw "重发旧版本 $tag 时不应覆盖 Latest 指向，请检查 gh release edit 行为。"
              }
            }
          } else {
            # 首次发布一次性携带安装包与校验文件，让 gh release create 原子上传后再公开，避免空 Release 窗口。
            gh release create $tag $installer $checksums --repo $env:GITHUB_REPOSITORY --verify-tag $latestFlag --title "几格 v$env:JIGE_VERSION" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "is_latest=$isLatest" >> $env:GITHUB_OUTPUT

  sync-mirror:
    name: 同步正式版到国内镜像
    needs: release
    if: needs.release.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 通过受限部署通道推送到 download.imfourj.cn
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JIGE_VERSION: ${{ needs.release.outputs.version }}
          MIRROR_HOST: ${{ secrets.JIGE_MIRROR_HOST }}
          MIRROR_SSH_KEY: ${{ secrets.JIGE_MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.JIGE_MIRROR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_HOST}" ] || [ -z "${MIRROR_SSH_KEY}" ] || [ -z "${MIRROR_KNOWN_HOSTS}" ]; then
            if [ "${GITHUB_REPOSITORY}" = "deepfry666/jige-battery" ]; then
              echo "::error::主仓库缺少国内镜像同步密钥，禁止静默跳过以免国内用户停更。"
              exit 1
            fi
            echo "::notice::Fork 仓库未配置国内镜像同步密钥，跳过同步。"
            exit 0
          fi

          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT

          tag="v${JIGE_VERSION}"
          exe="Jige-Setup-${JIGE_VERSION}-x64.exe"

          mkdir -p "$workdir/pkg"
          for attempt in 1 2 3; do
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$workdir/pkg" --clobber --pattern "$exe" --pattern "SHA256SUMS.txt"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::下载正式版 Release 附件重试 3 次后仍失败。"
              exit 1
            fi
            sleep 5
          done
          (cd "$workdir/pkg" && sha256sum -c SHA256SUMS.txt)
          body=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          exe_size=$(stat -c %s "$workdir/pkg/$exe")
          sums_size=$(stat -c %s "$workdir/pkg/SHA256SUMS.txt")

          jq -n \
            --arg tag "$tag" \
            --arg body "$body" \
            --arg exe "$exe" \
            --argjson exe_size "$exe_size" \
            --argjson sums_size "$sums_size" \
            '{
              tag_name: $tag,
              body: $body,
              draft: false,
              prerelease: false,
              assets: [
                {
                  name: $exe,
                  size: $exe_size,
                  browser_download_url: ("https://download.imfourj.cn/jige-battery/releases/" + $tag + "/" + $exe)
                },
                {
                  name: "SHA256SUMS.txt",
                  size: $sums_size,
                  browser_download_url: ("https://download.imfourj.cn/jige-battery/releases/" + $tag + "/SHA256SUMS.txt")
                }
              ]
            }' > "$workdir/pkg/latest.json"

          tar -czf "$workdir/payload.tar.gz" -C "$workdir/pkg" latest.json "$exe" SHA256SUMS.txt
          tar_sha=$(sha256sum "$workdir/payload.tar.gz" | awk '{print $1}')

          printf '%s\n' "$MIRROR_SSH_KEY" > "$workdir/id_ed25519"
          chmod 600 "$workdir/id_ed25519"
          printf '%s\n' "$MIRROR_KNOWN_HOSTS" > "$workdir/known_hosts"
          chmod 644 "$workdir/known_hosts"

          for attempt in 1 2 3; do
            if ssh -i "$workdir/id_ed25519" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$workdir/known_hosts" \
              -o ConnectTimeout=15 \
              "root@${MIRROR_HOST}" "publish-stable ${JIGE_VERSION} ${tar_sha}" < "$workdir/payload.tar.gz"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::国内镜像同步重试 3 次后仍失败。"
              exit 1
            fi
            sleep 5
          done

          curl -fsSL --retry 3 --retry-delay 3 --max-time 20 "https://download.imfourj.cn/jige-battery/latest.json" \
            | jq -e --arg tag "$tag" --arg exe "$exe" --argjson exe_size "$exe_size" --argjson sums_size "$sums_size" '
              .tag_name == $tag and
              any(.assets[]; .name == $exe and .size == $exe_size) and
              any(.assets[]; .name == "SHA256SUMS.txt" and .size == $sums_size)
            ' >/dev/null
