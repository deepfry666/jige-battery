<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>几格 品牌标志</title>
<style>
:root{
  color-scheme: light dark;
  --font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --ink:#211d19; --paper:#f6f3ee; --ink-d:#f0ece4; --paper-d:#1a1816;
  --text:#211d19; --text-2:#6a625a; --line:rgba(33,29,25,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --text:#f0ece4; --text-2:#b8afa4; --line:rgba(240,236,228,.12); }
}
:root[data-theme="dark"]{ --text:#f0ece4; --text-2:#b8afa4; --line:rgba(240,236,228,.12); }
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:var(--font);color:var(--text);font-size:14px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:4px 0 24px}
.concept{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.head{margin-bottom:14px}
.head b{font-size:16px;margin-right:8px}
.head .k{font-size:12px;color:var(--text-2)}
.head p{margin:4px 0 0;color:var(--text-2);font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.card{flex:1 1 210px;border-radius:12px;padding:18px;display:flex;align-items:center;gap:18px;min-width:0}
.paper{background:var(--paper);color:var(--ink)}
.night{background:var(--paper-d);color:var(--ink-d)}
.sizes{display:flex;align-items:flex-end;gap:12px}
.sizes span{display:block;font-size:10px;text-align:center;opacity:.55;margin-top:3px}
.tiles{display:flex;gap:10px;align-items:center}
.tile{width:64px;height:64px;border-radius:15px;display:grid;place-items:center}
.lock{flex:1 1 320px;border-radius:12px;border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.lockup{display:flex;align-items:center;gap:12px}
.lockup .cn{font-size:26px;font-weight:600;letter-spacing:.08em}
.lockup .en{font-size:11px;letter-spacing:.32em;color:var(--text-2);margin-top:2px}
.family{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding:6px 2px}
.family figure{margin:0;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2)}
.family figure svg{color:var(--text)}
svg{display:block}
</style>
</head>
<body>

  <defs>

    <symbol id="A" viewBox="0 0 256 256">

        <path d="M140 36 L176 29 L176 70 L140 77 Z" opacity=".32"/>
        <path d="M140 89 L176 82 L176 123 L140 130 Z"/>
        <path d="M140 142 L176 135 L176 180 C176 222 148 238 114 236 C90 234 70 220 60 196 C78 210 96 215 113 213 C132 211 140 198 140 182 Z"/>
      </g>

6.934, 372.060 659.118 C 375.239 665.349, 380.555 670.562, 386.211 672.995 C 390.566 674.869, 392.718 675.161, 399.541 674.803 C 406.261 674.450, 408.967 673.759, 415.088 670.835 C 424.298 666.436, 432.990 659.987, 459.585 637.822 C 493.481 609.573, 505.349 600.434, 526.500 586.294 C 553.213 568.435, 578.241 556.183, 605.500 547.621 C 618.672 543.484, 636.309 540.479, 653.500 539.444 C 665.932 538.696, 685.420 540.089, 704 543.056 C 719.461 545.525, 745.691 552.290, 765.389 558.889 C 788.871 566.756, 784.303 564.448, 737.500 544.797 C 706.313 531.703, 663.912 515.421, 627 502.367 C 568.769 481.773, 555.352 476.767, 545.482 471.957 C 533.674 466.202, 528.600 461.594, 528.600 456.626 C 528.600 449.827, 534.052 445.188, 549 439.267 C 553.675 437.415, 569.875 432.081, 585 427.412 C 617.066 417.515, 631.489 412.519, 646 406.285 C 677.066 392.938, 696.559 377.083, 707.822 356 C 713.146 346.035, 715.703 337.244, 717.057 324.246 C 717.979 315.402, 717.899 311.372, 716.608 301.476 C 713.226 275.569, 703.111 250.986, 683.822 221.793 C 665.611 194.230, 647.411 172.386, 618.522 143.418 C 593.773 118.601, 580.817 107.212, 557.319 89.616 C 528.674 68.166, 498.462 50.694, 470.958 39.673 C 444.975 29.262, 425.688 25.008, 402 24.465 C 393.475 24.269, 383.838 24.528, 380.585 25.039" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="wrap" id="root"></div>
<script>
const concepts = [
  {id:'A', name:'J 格', key:'产品感最强', desc:'"几格"首字母 J 的竖笔拆成三格电量，亮两格、空一格，最后一格顺势收成钩。单色、几何，和托盘里的格子电量条是同一套语言。'},
  {id:'B', name:'一笔几', key:'和四季画布最像一家', desc:'一撇加一个横折弯钩写出"几"，钩尾回扬，同时读作 J。像四季画布那样是一笔墨色的带状笔画，有书写感。'},
  {id:'C', name:'几格', key:'名字就是图形', desc:'在"一笔几"的基础上，把右边一竖断成三格，最后一格收成钩。"几"加"格"就是产品名，书写感和格子同时在。'},
];
const use = (id, s) => '<svg width="'+s+'" height="'+s+'" viewBox="0 0 256 256"><use href="#'+id+'"/></svg>';
document.getElementById('root').innerHTML =
 concepts.map(c => `
  <div class="concept">
    <div class="head"><b>方案 ${c.id} · ${c.name}</b><span class="k">${c.key}</span><p>${c.desc}</p></div>
    <div class="row">
      <div class="card paper">${use(c.id,104)}<div class="sizes">${[48,32,24,16].map(s=>'<div>'+use(c.id,s)+'<span>'+s+'</span></div>').join('')}</div></div>
      <div class="card night">${use(c.id,104)}<div class="sizes">${[48,32,24,16].map(s=>'<div>'+use(c.id,s)+'<span>'+s+'</span></div>').join('')}</div></div>
      <div class="lock">
        <div class="lockup">${use(c.id,44)}<div><div class="cn">几格</div><div class="en">JIGE · FOURJ</div></div></div>
        <div class="tiles">
          <div class="tile paper">${use(c.id,46)}</div>
          <div class="tile night">${use(c.id,46)}</div>
          <span style="font-size:12px;color:var(--text-2)">应用图标：纸底墨字 / 夜底纸字</span>
        </div>
      </div>
    </div>
  </div>`).join('') +
 `<div class="concept"><div class="head"><b>放进 FourJ 家族看一眼</b><p>和四季画布标志并排，确认是同一个人做的东西。</p></div>
   <div class="family">
     <figure><svg width="46" height="40" viewBox="0 0 804 699"><use href="#FJ"/></svg>四季画布</figure>
     ${concepts.map(c=>'<figure>'+use(c.id,44)+'几格 · '+c.id+'</figure>').join('')}
   </div></div>`;
</script>
</body>
</html>
