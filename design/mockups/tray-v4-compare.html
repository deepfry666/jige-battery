<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>托盘方案对比</title>
<style>

.sub{color:var(--muted-foreground);margin:0 0 12px}
.opt{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.opt h3{margin:0 0 4px;font-size:15px}
.opt p{margin:0 0 10px;color:var(--muted-foreground)}
.who{font-size:12px;border-radius:4px;padding:1px 6px;margin-right:8px;vertical-align:1px;background:var(--secondary);color:var(--secondary-foreground)}

.scroll{overflow-x:auto}
svg{display:block}
.taskbar{display:inline-flex;align-items:center;justify-content:flex-end;gap:10px;height:48px;padding:0 12px 0 16px;background:rgb(28,31,40)}

.taskbar.light .sys-clock{color:#1b1b1b}.taskbar.scale-2x .sys-clock{font-size:24px}
.wall{display:inline-block;padding:12px;background:#2a3140}.wall.light{background:#cfd6e0}
</style></head><body>
<p class="sub">六个方案按真实像素画。示例设备：键盘 80%、鼠标 12%（低电量）、耳机 45% 充电中。深色条模拟你截图里的任务栏颜色。</p>
<div id="root"></div>
<script>
// ===== 像素位图字库（全部按真实整数像素绘制，crispEdges 渲染）=====
// 11x11 设备图形
const ICONS = {
  keyboard: [
    "...........",
    "...........",
    ".XXXXXXXXX.",
    "XXXXXXXXXXX",
    "X.X.X.X.X.X",
    "XXXXXXXXXXX",
    "XX.X.X.X.XX",
    "XXXXXXXXXXX",
    "XXX.....XXX",
    ".XXXXXXXXX.",
    "..........."
  ],
  mouse: [
    "...XXXXX...",
    "..XXX.XXX..",
    ".XXXX.XXXX.",
    ".XXXX.XXXX.",
    ".XXXX.XXXX.",
    ".XXXXXXXXX.",
    ".XXXXXXXXX.",
    ".XXXXXXXXX.",
    ".XXXXXXXXX.",
    "..XXXXXXX..",
    "...XXXXX..."
  ],
  headset: [
    "..XXXXXXX..",
    ".XX.....XX.",
    "XX.......XX",
    "XX.......XX",
    "XX.......XX",
    "XXX.....XXX",
    "XXX.....XXX",
    "XXX.....XXX",
    "XXX.....XXX",
    ".XX.....XX.",
    "..........."
  ]
};

// 5x7 充电闪电
const BOLT = [
  "...XX",
  "..XX.",
  ".XX..",
  "XXXXX",
  "..XX.",
  ".XX..",
  "XX..."
];

// 6x9 清晰加粗像素数字（对齐 Win11 任务栏 12px 时钟字高）
const DIG69 = {
  "0": [".XXXX.", "XX..XX", "XX..XX", "XX..XX", "XX..XX", "XX..XX", "XX..XX", "XX..XX", ".XXXX."],
  "1": ["..XX..", ".XXX..", "XX.X..", "..XX..", "..XX..", "..XX..", "..XX..", "..XX..", ".XXXX."],
  "2": [".XXXX.", "XX..XX", "....XX", "...XX.", "..XX..", ".XX...", "XX....", "XX....", "XXXXXX"],
  "3": [".XXXX.", "XX..XX", "....XX", "..XXX.", "....XX", "....XX", "....XX", "XX..XX", ".XXXX."],
  "4": ["...XX.", "..XXX.", ".XXXX.", "XX.XX.", "XX.XX.", "XXXXXX", "...XX.", "...XX.", "...XX."],
  "5": ["XXXXXX", "XX....", "XX....", "XXXXX.", "....XX", "....XX", "....XX", "XX..XX", ".XXXX."],
  "6": [".XXXX.", "XX....", "XX....", "XXXXX.", "XX..XX", "XX..XX", "XX..XX", "XX..XX", ".XXXX."],
  "7": ["XXXXXX", "....XX", "...XX.", "...XX.", "..XX..", "..XX..", ".XX...", ".XX...", ".XX..."],
  "8": [".XXXX.", "XX..XX", "XX..XX", ".XXXX.", "XX..XX", "XX..XX", "XX..XX", "XX..XX", ".XXXX."],
  "9": [".XXXX.", "XX..XX", "XX..XX", ".XXXXX", "....XX", "....XX", "....XX", "XX..XX", ".XXXX."],
  "%": ["......", "XX...X", "XX..X.", "...X..", "..X...", ".X....", "X...XX", "....XX", "......"]
};

const DEVICES = [
  { kind: "keyboard", name: "键盘", pct: 80, chg: false },
  { kind: "mouse",    name: "鼠标", pct: 12, chg: false },
  { kind: "headset",  name: "耳机", pct: 45, chg: true  }
];

function drawBits(bits, x0, y0, fill) {
  let out = "";
  for (let y = 0; y < bits.length; y++) {
    const row = bits[y];
    for (let x = 0; x < row.length; x++) {
      if (row[x] === "X") {
        out += `<rect x="${x0 + x}" y="${y0 + y}" width="1" height="1" fill="${fill}"/>`;
      }
    }
  }
  return out;
}

function drawText69(str, x0, y0, fill) {
  let out = "", x = x0;
  for (const ch of str) {
    const bm = DIG69[ch];
    if (bm) {
      out += drawBits(bm, x, y0, fill);
      x += bm[0].length + (ch === "%" ? 0 : 1);
    }
  }
  return out;
}

function textWidth69(str) {
  let w = 0;
  for (let i = 0; i < str.length; i++) {
    w += 6;
    if (i < str.length - 1) w += 1;
  }
  return w;
}

// 系统任务栏右侧参考（折叠箭头、Wi-Fi、音量、时钟）
function sysTrayRight(dark, scale) {
  const c = dark ? "#f3f3f3" : "#1b1b1b";
  const s = scale;
  const chev = `<svg width="${12*s}" height="${12*s}" viewBox="0 0 12 12" shape-rendering="crispEdges">
    <rect x="5" y="4" width="2" height="1" fill="${c}"/>
    <rect x="4" y="5" width="1" height="1" fill="${c}"/><rect x="7" y="5" width="1" height="1" fill="${c}"/>
    <rect x="3" y="6" width="1" height="1" fill="${c}"/><rect x="8" y="6" width="1" height="1" fill="${c}"/>
    <rect x="2" y="7" width="1" height="1" fill="${c}"/><rect x="9" y="7" width="1" height="1" fill="${c}"/>
  </svg>`;
  const wifi = `<svg width="${14*s}" height="${12*s}" viewBox="0 0 14 12" shape-rendering="crispEdges">
    <rect x="3" y="2" width="8" height="1" fill="${c}"/>
    <rect x="2" y="3" width="1" height="1" fill="${c}"/><rect x="11" y="3" width="1" height="1" fill="${c}"/>
    <rect x="4" y="5" width="6" height="1" fill="${c}"/>
    <rect x="3" y="6" width="1" height="1" fill="${c}"/><rect x="10" y="6" width="1" height="1" fill="${c}"/>
    <rect x="6" y="8" width="2" height="2" fill="${c}"/>
  </svg>`;
  const vol = `<svg width="${14*s}" height="${12*s}" viewBox="0 0 14 12" shape-rendering="crispEdges">
    <rect x="2" y="4" width="2" height="4" fill="${c}"/>
    <rect x="4" y="3" width="2" height="6" fill="${c}"/>
    <rect x="6" y="2" width="1" height="8" fill="${c}"/>
    <rect x="9" y="4" width="1" height="4" fill="${c}"/>
    <rect x="11" y="3" width="1" height="6" fill="${c}"/>
  </svg>`;
  return `<div class="sys-right">${chev}${wifi}${vol}<div class="sys-clock">16:04<br>2026/11/20</div></div>`;
}

// =========================================================================
// 方案一：任务栏直读条（嵌在任务栏托盘左侧，无框融入，图标 + 清晰大数字）
// =========================================================================
function paletteP1(dark) {
  return dark ? {
    fg: "#f0ece4",
    muted: "#9aa1b0",
    lowBg: "#4a2329",
    lowBorder: "#8c3742",
    lowFg: "#ff8080",
    chgFg: "#4ce07a",
    sep: "#393e4c"
  } : {
    fg: "#211d19",
    muted: "#666",
    lowBg: "#fad6d8",
    lowBorder: "#e09297",
    lowFg: "#b42318",
    chgFg: "#0f7b38",
    sep: "#d2d2d2"
  };
}

function renderP1Strip(devices, dark, scale, withGrid) {
  const pal = paletteP1(dark);
  const H = 22;
  let x = 0;
  let body = "";

  devices.forEach((d, idx) => {
    const isLow = !d.chg && d.pct <= 20;
    const fg = d.chg ? pal.chgFg : isLow ? pal.lowFg : pal.fg;
    const pctStr = `${d.pct}%`;
    const iconW = 11;
    const boltW = d.chg ? 7 : 0;
    const textW = textWidth69(pctStr);
    const padX = 4;
    const segW = padX + iconW + 3 + boltW + textW + padX;

    if (false) {
      // 用户 2026-11-20 要求去掉低电量红底框，只把图标和数字变红
      body += `<rect x="${x}" y="1" width="${segW}" height="${H - 2}" fill="${pal.lowBg}"/>`;
      body += `<rect x="${x + 1}" y="0" width="${segW - 2}" height="1" fill="${pal.lowBorder}"/>`;
      body += `<rect x="${x + 1}" y="${H - 1}" width="${segW - 2}" height="1" fill="${pal.lowBorder}"/>`;
      body += `<rect x="${x}" y="1" width="1" height="${H - 2}" fill="${pal.lowBorder}"/>`;
      body += `<rect x="${x + segW - 1}" y="1" width="1" height="${H - 2}" fill="${pal.lowBorder}"/>`;
    }

    // 设备图标
    body += drawBits(ICONS[d.kind], x + padX, 5, fg);
    let cx = x + padX + iconW + 3;

    // 充电闪电
    if (d.chg) {
      body += drawBits(BOLT, cx, 7, pal.chgFg);
      cx += 7;
    }

    // 大号百分比数字
    body += drawText69(pctStr, cx, 6, fg);

    x += segW;
    if (idx < devices.length - 1) {
      x += 4;
      if (true) {
        body += `<rect x="${x - 2}" y="6" width="1" height="10" fill="${pal.sep}"/>`;
      }
    }
  });

  const W = x;
  let grid = "";
  if (withGrid) {
    for (let gx = 0; gx <= W; gx++) {
      grid += `<rect x="${gx}" y="0" width="0.12" height="${H}" fill="rgba(255,255,255,0.08)"/>`;
    }
    for (let gy = 0; gy <= H; gy++) {
      grid += `<rect x="0" y="${gy}" width="${W}" height="0.12" fill="rgba(255,255,255,0.08)"/>`;
    }
  }
  return `<svg width="${W * scale}" height="${H * scale}" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges">${body}${grid}</svg>`;
}

// =========================================================================
// 方案二：单图标「几格」多排格表（1 个 16×16 原生托盘图标，汇总全桌设备）
// =========================================================================
function paletteP2(dark) {
  return dark ? {
    ok: "#f0ece4",
    empty: "#525868",
    low: "#ff5c5c",
    lowEmpty: "#5e333a",
    chg: "#3fd16b",
    chgNext: "#266e42",
    chgEmpty: "#384d43"
  } : {
    ok: "#211d19",
    empty: "#c2c6cf",
    low: "#d13438",
    lowEmpty: "#e5bfc2",
    chg: "#10893e",
    chgNext: "#7cc899",
    chgEmpty: "#bdd4c5"
  };
}

function renderP2Row(d, y, h, pal) {
  // 5 格，每格代表 20%：80% -> 4 格；45% -> 2 格（充电中第 3 格浅绿提示正在充）；12% -> 1 格红
  const isLow = !d.chg && d.pct <= 20;
  const lit = d.pct <= 0 ? 0 : Math.max(1, Math.min(5, Math.round(d.pct / 20)));
  const xs = [1, 4, 7, 10, 13]; // 每格 2px 宽，间隔 1px，总宽 14px，左右各留 1px 呼吸边
  let out = "";
  for (let i = 0; i < 5; i++) {
    let fill;
    if (d.chg) {
      if (i < lit) fill = pal.chg;
      else if (i === lit && lit < 5) fill = pal.chgNext;
      else fill = pal.chgEmpty;
    } else if (isLow) {
      fill = i < lit ? pal.low : pal.lowEmpty;
    } else {
      fill = i < lit ? pal.ok : pal.empty;
    }
    out += `<rect x="${xs[i]}" y="${y}" width="2" height="${h}" fill="${fill}"/>`;
  }
  return out;
}

function renderP2Icon(devices, dark, scale, withGrid) {
  const pal = paletteP2(dark);
  let body = "";
  if (devices.length === 1) {
    // 单台 / 仅最低电量模式：单排超大 5 格（高 10px）
    body += renderP2Row(devices[0], 3, 10, pal);
  } else if (devices.length === 2) {
    // 2 台日常模式（最常见）：上下两排大格（每排高 6px，中间空 2px）
    body += renderP2Row(devices[0], 1, 6, pal);
    body += renderP2Row(devices[1], 9, 6, pal);
  } else {
    // 3 台同屏模式：上中下三排（每排高 4px，中间空 1px）
    body += renderP2Row(devices[0], 1, 4, pal);
    body += renderP2Row(devices[1], 6, 4, pal);
    body += renderP2Row(devices[2], 11, 4, pal);
  }
  let grid = "";
  if (withGrid) {
    const gc = dark ? "rgba(255,255,255,0.10)" : "rgba(0,0,0,0.10)";
    for (let i = 0; i <= 16; i++) {
      grid += `<rect x="${i}" y="0" width="0.1" height="16" fill="${gc}"/>`;
      grid += `<rect x="0" y="${i}" width="16" height="0.1" fill="${gc}"/>`;
    }
  }
  return `<svg width="${16 * scale}" height="${16 * scale}" viewBox="0 0 16 16" shape-rendering="crispEdges">${body}${grid}</svg>`;
}

// =========================================================================
// 方案三：屏角「几格」微贴片（不碰任务栏，独立可点穿竖排品牌卡片）
// =========================================================================
function paletteP3(dark) {
  return dark ? {
    bg: "#211d19",
    border: "#3e3730",
    fg: "#f0ece4",
    empty: "#453e37",
    lowRowBg: "#3a2123",
    lowFg: "#ff7a7a",
    lowEmpty: "#5c3336",
    chgFg: "#4ce07a",
    chgNext: "#266e42",
    chgEmpty: "#33473b"
  } : {
    bg: "#f0ece4",
    border: "#cfc7ba",
    fg: "#211d19",
    empty: "#d5cec3",
    lowRowBg: "#f5d7d8",
    lowFg: "#b42318",
    lowEmpty: "#e6b9bc",
    chgFg: "#0f7b38",
    chgNext: "#7cc899",
    chgEmpty: "#c4d6ca"
  };
}

function renderP3Card(devices, dark, scale, withGrid) {
  const pal = paletteP3(dark);
  const rowH = 18;
  const padY = 5;
  const W = 100;
  const H = padY * 2 + devices.length * rowH + (devices.length - 1) * 2;
  let body = "";

  // 卡片底板 + 1px 清晰描边（四角 1px 切角圆润感）
  body += `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" fill="${pal.bg}"/>`;
  body += `<rect x="1" y="0" width="${W - 2}" height="1" fill="${pal.border}"/>`;
  body += `<rect x="1" y="${H - 1}" width="${W - 2}" height="1" fill="${pal.border}"/>`;
  body += `<rect x="0" y="1" width="1" height="${H - 2}" fill="${pal.border}"/>`;
  body += `<rect x="${W - 1}" y="1" width="1" height="${H - 2}" fill="${pal.border}"/>`;

  devices.forEach((d, idx) => {
    const ry = padY + idx * (rowH + 2);
    const isLow = !d.chg && d.pct <= 20;
    const fg = d.chg ? pal.chgFg : isLow ? pal.lowFg : pal.fg;

    if (isLow) {
      body += `<rect x="3" y="${ry}" width="${W - 6}" height="${rowH}" fill="${pal.lowRowBg}"/>`;
    }

    // 左侧：清晰设备图标 (x=6)
    body += drawBits(ICONS[d.kind], 6, ry + 3, fg);

    // 中间：5 格「几格」实心电量格 (x=21..54，每格 5×10px，间距 2px)
    const lit = d.pct <= 0 ? 0 : Math.max(1, Math.min(5, Math.round(d.pct / 20)));
    for (let i = 0; i < 5; i++) {
      let cFill;
      if (d.chg) {
        cFill = i < lit ? pal.chgFg : (i === lit && lit < 5 ? pal.chgNext : pal.chgEmpty);
      } else if (isLow) {
        cFill = i < lit ? pal.lowFg : pal.lowEmpty;
      } else {
        cFill = i < lit ? pal.fg : pal.empty;
      }
      body += `<rect x="${21 + i * 7}" y="${ry + 4}" width="5" height="10" fill="${cFill}"/>`;
    }

    // 右侧：充电小闪电（若有）+ 右对齐百分比数字
    const pctStr = `${d.pct}%`;
    const tw = textWidth69(pctStr);
    const tx = W - 6 - tw;
    if (d.chg) {
      body += drawBits(BOLT, tx - 7, ry + 5, pal.chgFg);
    }
    body += drawText69(pctStr, tx, ry + 4, fg);
  });

  let grid = "";
  if (withGrid) {
    const gc = dark ? "rgba(255,255,255,0.07)" : "rgba(0,0,0,0.07)";
    for (let gx = 0; gx <= W; gx += 2) {
      grid += `<rect x="${gx}" y="0" width="0.16" height="${H}" fill="${gc}"/>`;
    }
    for (let gy = 0; gy <= H; gy += 2) {
      grid += `<rect x="0" y="${gy}" width="${W}" height="0.16" fill="${gc}"/>`;
    }
  }
  return `<svg width="${W * scale}" height="${H * scale}" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges">${body}${grid}</svg>`;
}
const TB={dark:{bg:"rgb(28,31,40)",fg:"#ffffff",track:"#4b4f5c",low:"#ff6b6b",warn:"#ffc83d",chg:"#3fd16b",clock:"#ffffff"},
          light:{bg:"#eeeeee",fg:"#1b1b1b",track:"#b9b9b9",low:"#d13438",warn:"#b37400",chg:"#107c10",clock:"#1b1b1b"}};
const devs=[{kind:"keyboard",pct:80},{kind:"mouse",pct:12},{kind:"headset",pct:45,chg:true}];
function col(d,t){return d.chg?t.chg:d.pct<=15?t.low:d.pct<=30?t.warn:t.fg}
function bits(bm,x0,y0,fill){let s="";bm.forEach((r,y)=>{for(let x=0;x<r.length;x++)if(r[x]==="X")s+=`<rect x="${x0+x}" y="${y0+y}" width="1" height="1" fill="${fill}"/>`});return s}
// 10px 高的小图形，给任务栏文字用
const MINI={
 keyboard:["XXXXXXXXXXXXX","X.X.X.X.X.X.X","XXXXXXXXXXXXX","XX.X.X.X.X.XX","XXXXXXXXXXXXX","XXX.......XXX","XXXXXXXXXXXXX"],
 mouse:["..XXX..",".XXXXX.","XX.X.XX","XX.X.XX","XXXXXXX","XXXXXXX","XXXXXXX","XXXXXXX",".XXXXX.","..XXX.."],
 headset:["..XXXXXX..",".XX....XX.","XX......XX","X........X","XXX....XXX","XXX....XXX","XXX....XXX","XXX....XXX",".X......X."]};
const MW={keyboard:13,mouse:7,headset:10}, MH={keyboard:7,mouse:10,headset:9};

function chevron(x,t){return `<path d="M${x} 27 l4 -4 l4 4" stroke="${t.fg}" stroke-width="1.2" fill="none" shape-rendering="geometricPrecision"/>`}
function clock(x,t){return `<text x="${x}" y="21" font-size="12" fill="${t.clock}" text-anchor="end" font-family="Segoe UI Variable,Segoe UI,sans-serif">15:42</text><text x="${x}" y="37" font-size="12" fill="${t.clock}" text-anchor="end" font-family="Segoe UI Variable,Segoe UI,sans-serif">2026/11/20</text>`}
function logo(x,y,t){ // 「几格」默认图标的简化占位：墨色方块里三格
 return `<rect x="${x}" y="${y}" width="16" height="16" rx="3" fill="${t.fg}"/>`+[0,1,2].map(i=>`<rect x="${x+3+i*4}" y="${y+4}" width="2" height="8" fill="${t===TB.dark?"#1c1f28":"#eeeeee"}"/>`).join("")}

// 方案 1：任务栏文字条
function opt1(t){
 let s="",x=40;
 const rows=devs.slice(0,2); // 两行；第三台设备并到下一列
 const cols=[devs.slice(0,2),devs.slice(2)];
 cols.forEach(c=>{
  c.forEach((d,i)=>{
   const yc=c.length===1?24:(i===0?16:32);
   s+=bits(MINI[d.kind],x+(13-MW[d.kind])/2|0,yc-(MH[d.kind]/2|0),t.fg);
   s+=`<text x="${x+17}" y="${yc+4.5}" font-size="13" font-weight="600" fill="${col(d,t)}" font-family="Segoe UI Variable,Segoe UI,sans-serif">${d.pct}%</text>`;
   if(d.chg){const bx=x+17+String(d.pct).length*7.6+11;s+=`<path d="M${bx+3} ${yc-6} L${bx} ${yc+1} H${bx+3} L${bx+2} ${yc+6} L${bx+6} ${yc-1} H${bx+3} Z" fill="${t.chg}"/>`}
  });
  x+=62;
 });
 return {w:x+130,body:chevron(16,t)+s+logo(x+6,16,t)+clock(x+108,t)};
}
// 方案 2：一个图标汇总所有设备
function opt2(t){
 const x0=44,y0=16;let s=`<g shape-rendering="crispEdges">`;
 devs.forEach((d,i)=>{const bx=x0+i*6,h=Math.max(1,Math.round(d.pct/100*16));
  s+=`<rect x="${bx}" y="${y0}" width="4" height="16" fill="${t.track}"/><rect x="${bx}" y="${y0+16-h}" width="4" height="${h}" fill="${col(d,t)}"/>`});
 s+=`</g>`;
 return {w:200,body:chevron(16,t)+s+clock(190,t)};
}
// 方案 3：「几格」格子图标，每台设备一个
function opt3(t){
 let s=`<g shape-rendering="crispEdges">`;
 devs.forEach((d,i)=>{const x0=44+i*28,y0=16,n=Math.max(1,Math.ceil(d.pct/20));
  for(let k=0;k<5;k++){const cx=x0+1+k*3;s+=`<rect x="${cx}" y="${y0+1}" width="2" height="14" fill="${k<n?col(d,t):t.track}"/>`}});
 s+=`</g>`;
 return {w:230,body:chevron(16,t)+s+clock(220,t)};
}
function bar(fn,theme,z){const t=TB[theme],{w,body}=fn(t);
 return `<svg width="${w*z}" height="${48*z}" viewBox="0 0 ${w} 48"><rect width="${w}" height="48" fill="${t.bg}"/>${body}</svg>`}


const tb=(strip,dark,s)=>`<div class="taskbar ${dark?"":"light"} ${s===2?"scale-2x":""}">${strip}${sysTrayRight(dark,s)}</div>`;
const R=[
 ["Claude","1","任务栏文字",true,"托盘左边直接写「设备图形 + 百分比」，两台上下两行，字和时钟一样大。低电量数字变红，充电变绿。风险：靠把窗口挂到任务栏上，Windows 大更新后可能要修，保留改回托盘图标的开关。",
  d=>bar(opt1,d?"dark":"light",1), ()=>bar(opt1,"dark",2)],
 ["Claude","2","一个图标看全部",false,"托盘只有一个图标，每台设备一根粗竖条，顺序固定。一眼看出谁该充电，但没有数字和设备图形。",
  d=>bar(opt2,d?"dark":"light",1), ()=>bar(opt2,"dark",2)],
 ["Claude","3","「几格」格子",false,"每台设备一个图标，5 根粗格子，剩几格亮几格。对上品牌名，但图标上看不出是哪台设备。",
  d=>bar(opt3,d?"dark":"light",1), ()=>bar(opt3,"dark",2)],
 ["反重力","4","任务栏直读条",true,"思路和方案 1 相同，做成横排一行：像素图标 + 像素数字，低电量图标和数字变红（已按你的要求去掉红底框），充电带绿闪电。风险同方案 1。",
  d=>tb(renderP1Strip(DEVICES,d,1,false),d,1), ()=>tb(renderP1Strip(DEVICES,true,2,false),true,2)],
 ["反重力","5","单图标多排格表",false,"一个托盘图标里上下分排，每台设备一排 5 格，靠排位分设备，悬停看数字。普通托盘图标，没有兼容风险。",
  d=>tb(renderP2Icon(DEVICES.slice(0,2),d,1,false),d,1), ()=>tb(renderP2Icon(DEVICES.slice(0,2),true,2,false),true,2)],
 ["反重力","6","屏角微贴片",false,"任务栏上方屏幕角落放一张约 100px 宽的小卡片：图标 + 5 格 + 数字。不碰任务栏，鼠标可点穿、靠近会淡出，全屏游戏时隐藏；但会压住最大化窗口的一小角。",
  d=>`<div class="wall ${d?"":"light"}">${renderP3Card(DEVICES,d,1,false)}</div>`, ()=>`<div class="wall">${renderP3Card(DEVICES,true,2,false)}</div>`]
];
const root=document.getElementById("root");
for(const [who,n,t,rec,desc,real,big] of R){
 const el=document.createElement("div");el.className="opt";
 el.innerHTML=`<h3><span class="who">${who}</span>方案 ${n}　${t}${rec?'<span class="rec">'+who+'推荐</span>':''}</h3><p>${desc}</p>
 <div class="lab">实际大小 · 100% 缩放</div><div class="scroll">${real(true)}</div><div class="scroll" style="margin-top:6px">${real(false)}</div>
 <div class="lab">200% 缩放</div><div class="scroll">${big()}</div>`;
 root.appendChild(el);
}
</script></body></html>
