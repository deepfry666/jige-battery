  <circle cx="344" cy="124" r="9" fill="#5ec4ff"/>
  <text x="344" y="128" text-anchor="middle" fill="#08090a" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">2</text>
  <text x="186" y="175" fill="#7d828a" font-family="Segoe UI, PingFang SC, Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="11.5">复制链接</text>

  <!-- 中间箭头 -->
  <path d="M372 124h14m0 0-4-4m4 4-4 4" fill="none" stroke="#7d828a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

