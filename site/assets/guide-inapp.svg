  <text x="400" y="32" fill="#a1a6ae" font-family="Segoe UI, PingFang SC, Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">② 切到 Edge / Chrome 后直接下载</text>

  <rect x="396" y="46" width="344" height="156" rx="10" fill="#151619" stroke="#ffffff" stroke-opacity="0.14"/>
  <rect x="412" y="58" width="312" height="26" rx="6" fill="#1c1e22" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="424" y="75" fill="#a1a6ae" font-family="Segoe UI, sans-serif" font-size="11.5">jige.imfourj.cn/download.html</text>

