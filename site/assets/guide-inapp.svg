<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="微信或 QQ 内置浏览器切换到系统默认浏览器的操作示意图：点右上角三个点，选择在默认浏览器中打开">
