  <circle cx="328" cy="65" r="1.5" fill="#f7f8f8"/>
  <circle cx="334" cy="65" r="1.5" fill="#f7f8f8"/>
  <circle cx="340" cy="65" r="1.5" fill="#f7f8f8"/>
  <circle cx="350" cy="53" r="9" fill="#5ec4ff"/>
  <text x="350" y="57" text-anchor="middle" fill="#08090a" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">1</text>

